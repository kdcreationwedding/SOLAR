<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09131d"/>
      <stop offset="60%" stop-color="#142c44"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#skyGrad4)"/>

  <!-- Coastal Horizon & Sea -->
  <rect x="0" y="320" width="800" height="180" fill="url(#seaGrad)"/>

  <!-- Coastal Solar Platforms -->
  <g transform="translate(80, 290)">
    <polygon points="0,50 160,-10 360,-10 200,50" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="220,50 380,-10 580,-10 420,50" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  </g>
  <g transform="translate(30, 360)">
    <polygon points="0,60 190,-10 420,-10 230,60" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <polygon points="260,60 450,-10 680,-10 490,60" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
  </g>

  <!-- Sun -->
  <circle cx="400" cy="110" r="70" fill="#ffffff" opacity="0.9"/>
  <circle cx="400" cy="110" r="160" fill="#38bdf8" opacity="0.25"/>

  <!-- Badge -->
  <rect x="30" y="30" width="370" height="40" rx="20" fill="rgba(12,18,24,0.85)" stroke="rgba(56,189,248,0.5)" stroke-width="1"/>
  <text x="50" y="55" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="2">HAZIRA COASTAL SOLAR EPC • 45 MW</text>
</svg>
