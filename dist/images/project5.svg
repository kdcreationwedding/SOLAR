<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b192e"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#skyGrad5)"/>

  <!-- GIFT City Modern Financial Skyscraper Silhouettes -->
  <rect x="120" y="160" width="100" height="340" fill="#090d14" stroke="#60a5fa" stroke-width="1"/>
  <rect x="250" y="100" width="140" height="400" fill="#0c1218" stroke="#ffc72c" stroke-width="1.5"/>
  <rect x="420" y="180" width="110" height="320" fill="#090d14" stroke="#60a5fa" stroke-width="1"/>
  <rect x="560" y="140" width="130" height="360" fill="#0c1218" stroke="#60a5fa" stroke-width="1"/>

  <!-- Tower Top Rooftop Solar Glass Panels -->
  <polygon points="245,100 320,60 395,100" fill="#ffc72c" opacity="0.8"/>
  <line x1="250" y1="100" x2="390" y2="100" stroke="#ffffff" stroke-width="3"/>

  <!-- Glowing Sun Behind Towers -->
  <circle cx="320" cy="60" r="50" fill="#ffffff" opacity="0.95"/>
  <circle cx="320" cy="60" r="120" fill="#ffc72c" opacity="0.3"/>

  <!-- Badge -->
  <rect x="30" y="30" width="370" height="40" rx="20" fill="rgba(12,18,24,0.85)" stroke="rgba(255,199,44,0.5)" stroke-width="1"/>
  <text x="50" y="55" fill="#ffc72c" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="2">GIFT CITY SMART ROOFTOPS • 12.5 MW</text>
</svg>
