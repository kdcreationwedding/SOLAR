<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b192e"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="panelGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sunGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffc72c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Background Sky -->
  <rect width="800" height="500" fill="url(#skyGrad1)"/>

  <!-- Glowing Sun -->
  <circle cx="400" cy="120" r="70" fill="url(#sunGrad1)" opacity="0.9"/>
  <circle cx="400" cy="120" r="140" fill="#ffc72c" opacity="0.2"/>

  <!-- Horizon Ground -->
  <path d="M0,280 Q400,260 800,280 L800,500 L0,500 Z" fill="#0c1218"/>
  <path d="M0,320 Q400,300 800,320 L800,500 L0,500 Z" fill="#152232"/>

  <!-- Solar Panels Array - Row 1 -->
  <g transform="translate(100, 310)">
    <polygon points="0,60 120,0 260,0 140,60" fill="url(#panelGrad1)" stroke="#ffc72c" stroke-width="1.5"/>
    <polygon points="160,60 280,0 420,0 300,60" fill="url(#panelGrad1)" stroke="#ffc72c" stroke-width="1.5"/>
    <polygon points="320,60 440,0 580,0 460,60" fill="url(#panelGrad1)" stroke="#ffc72c" stroke-width="1.5"/>
  </g>

  <!-- Solar Panels Array - Row 2 -->
  <g transform="translate(40, 390)">
    <polygon points="0,80 150,0 320,0 170,80" fill="url(#panelGrad1)" stroke="#f97316" stroke-width="2"/>
    <polygon points="200,80 350,0 520,0 370,80" fill="url(#panelGrad1)" stroke="#f97316" stroke-width="2"/>
    <polygon points="400,80 550,0 720,0 570,80" fill="url(#panelGrad1)" stroke="#f97316" stroke-width="2"/>
  </g>

  <!-- Grid Transmission Lines -->
  <line x1="680" y1="200" x2="680" y2="360" stroke="#ffc72c" stroke-width="3"/>
  <line x1="640" y1="230" x2="720" y2="230" stroke="#ffc72c" stroke-width="2"/>
  <line x1="650" y1="270" x2="710" y2="270" stroke="#ffc72c" stroke-width="2"/>

  <!-- Text Overlay Badge -->
  <rect x="30" y="30" width="310" height="40" rx="20" fill="rgba(12,18,24,0.85)" stroke="rgba(255,199,44,0.5)" stroke-width="1"/>
  <text x="50" y="55" fill="#ffc72c" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="2">CHARANKA SOLAR PARK • 120 MW</text>
</svg>
